name: Bug report
description: Something in Manar does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do not belong here. Use the Security tab or email security@fixio.ae.
        Do not paste secrets, tokens, customer data or personal data.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. v0.4.2 or a1b2c3d
  - type: dropdown
    id: os
    attributes:
      label: Operating system (for the device app)
      options: [Not relevant, Windows 10, Windows 11, Linux, Other]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines with secrets removed.
      render: text
